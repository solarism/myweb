services:
  - type: web
    name: professor-website
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 'app:create_app()'
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: APP_ENV
        value: production
      - key: SOURCE_MD_DIR
        value: ./content/zh
      - key: TRUST_PROXY
        value: "1"
